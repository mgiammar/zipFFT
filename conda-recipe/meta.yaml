# Conda recipe for zipfft.
#
# Build targeting your specific GPU architecture:
#   CUDA_ARCHITECTURES=8.9 conda build conda-recipe/ -c nvidia -c pytorch
#
# Install the locally-built package:
#   conda install --use-local zipfft
#
# Set the package version at build time:
#   ZIPFFT_VERSION=0.1.0 conda build conda-recipe/ -c nvidia -c pytorch
{% set version = environ.get('ZIPFFT_VERSION', '0.0.3') %}

package:
  name: zipfft
  version: {{ version }}

source:
  git_url: https://github.com/mgiammar/zipFFT.git
  git_tag: v{{ version }}

build:
  number: 0
  # Pass through build-control env vars so users can customise the compilation.
  # CUDA_ARCHITECTURES: comma-separated SM versions, e.g. "8.9" or "8.0,8.9,9.0"
  # ENABLED_EXTENSIONS: comma-separated extension names, e.g. "padded_rconv2d"
  script_env:
    - CUDA_ARCHITECTURES
    - ENABLED_EXTENSIONS

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}    # provides nvcc; version is set by the conda-build channel pin
  host:
    - python >=3.12
    - pip
    - setuptools >=61.0
    - pybind11
    - pytorch >=2.7.0
    - pytorch-cuda               # ensures a CUDA-enabled PyTorch is selected
    - cufftdx                    # NVIDIA header-only library (nvidia channel)
  run:
    - python >=3.12
    # Pin to the exact PyTorch major.minor compiled against to avoid ABI mismatches.
    - {{ pin_compatible('pytorch', max_pin='x.x') }}

test:
  imports:
    - zipfft
  commands:
    - python -c "import zipfft; print('zipfft import OK')"

about:
  home: https://github.com/mgiammar/zipFFT
  license: MIT
  summary: >-
    Zero Implicit Padded FFT kernels for PyTorch — efficient CUDA convolution
    via cuFFTDx without explicit zero-padded intermediate arrays.
