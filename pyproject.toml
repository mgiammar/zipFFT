[build-system]
requires = [
    "setuptools>=61.0",
    "pybind11",
    "torch>=2.10.0",
    "numpy",
    "nvidia-mathdx>=25.06",
    "pyyaml",
    "ninja",
]
build-backend = "setuptools.build_meta"

[project]
name = "zipfft"
version = "0.1.0"
description = "Python bindings for Zero Implicit Padded (zip) FFT kernels in CUDA/cuFFTDx."
authors = [{ name = "Matthew Giammar", email = "mdgiammar@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Python package dependencies
dependencies = ["numpy", "torch>=2.10.0", "nvidia-mathdx>=25.06", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

# The package python module in the source directory
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
