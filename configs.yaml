  - {signal_y: 512, signal_x: 512, fft_y: 4096, fft_x: 4096, batch: 4, cross_correlate: true}
  - {signal_y: 512, signal_x: 512, fft_y: 4096, fft_x: 4096, batch: 8, cross_correlate: true}
  - {signal_y: 512, signal_x: 512, fft_y: 4096, fft_x: 4096, batch: 12, cross_correlate: true}
  - {signal_y: 512, signal_x: 512, fft_y: 4096, fft_x: 4096, batch: 16, cross_correlate: true}
  - {signal_y: 512, signal_x: 512, fft_y: 4096, fft_x: 4096, batch: 20, cross_correlate: true}
  - {signal_y: 512, signal_x: 512, fft_y: 4096, fft_x: 4096, batch: 24, cross_correlate: true}
  - {signal_y: 512, signal_x: 512, fft_y: 4096, fft_x: 4096, batch: 28, cross_correlate: true}
  - {signal_y: 512, signal_x: 512, fft_y: 4096, fft_x: 4096, batch: 32, cross_correlate: true}

